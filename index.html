<style>
/* Mismo estilo que la caja: blanco, rosa peonía, dorado. */
:root{
  --bg:#fbf6f8; --card:#fff; --ink:#221c1f; --muted:#86787f; --line:#f0e3e9;
  --accent:#c8186a; --accent-hover:#a31256; --accent-ink:#fff;
  --rosa:#fdeef4; --rosa-borde:#f4c6d9; --oro:#c7a04c; --oro-suave:#e8d6ab;
  --falta:#f4eef1; --falta-ink:#9a8c93;
  --pend:#fbf0d6; --pend-ink:#7d5a12;
  --ok:#e3f3e8; --ok-ink:#2e7d4f;
  --papel:#e7f1fb; --papel-ink:#1d4f8c;
  --bad:#b3261e;
  --r:14px;
  --f-marca:'Cinzel','Trajan Pro',Georgia,serif;
  --f-texto:'Jost',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-texto)}
button,input,select,textarea{font:inherit;color:inherit}
/* Encabezado tipo cartel */
header{background:var(--card);border-bottom:1px solid var(--oro-suave)}
.cartel{position:relative;display:flex;justify-content:center;align-items:center;min-height:96px;padding:10px 140px;overflow:hidden}
.cartel .flor{position:absolute;top:0;height:100%;width:auto;pointer-events:none;user-select:none}
.cartel .flor.izq{left:0;-webkit-mask-image:linear-gradient(to right,#000 55%,transparent);mask-image:linear-gradient(to right,#000 55%,transparent)}
.cartel .flor.der{right:0;-webkit-mask-image:linear-gradient(to left,#000 55%,transparent);mask-image:linear-gradient(to left,#000 55%,transparent)}
.marca{text-align:center;line-height:1}
.marca .nombre{font-family:var(--f-marca);font-weight:700;font-size:30px;letter-spacing:.06em;margin:0}
.marca .sub{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;font-family:var(--f-marca);font-size:11px;letter-spacing:.42em}
.marca .sub::before,.marca .sub::after{content:"";height:1px;width:46px;background:var(--oro)}
.marca .sub b{color:var(--oro);font-weight:400;letter-spacing:0;font-size:13px}
.barra-nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 16px 10px;border-top:1px solid var(--line);max-width:980px;margin:0 auto}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:transparent;border:1px solid transparent;padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:500;font-size:15px;letter-spacing:.02em}
nav button:hover{background:var(--rosa)}
nav button.on{background:var(--accent);color:var(--accent-ink)}
@media(max-width:640px){
  .cartel{min-height:70px;padding:8px 76px}
  .marca .nombre{font-size:20px}
  .marca .sub{font-size:9px;letter-spacing:.3em;gap:6px}
  .marca .sub::before,.marca .sub::after{width:18px}
  nav{width:100%} nav button{flex:1;padding:7px 8px;font-size:14px}
}
main{max-width:980px;margin:0 auto;padding:20px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
h2{font-family:var(--f-marca);font-weight:600;font-size:15px;letter-spacing:.06em;margin:0 0 12px}
h3{font-family:var(--f-marca);font-weight:600;font-size:14px;letter-spacing:.05em;margin:0}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=month],input[type=date],input[type=time],select,textarea{
  background:#fff;border:1px solid var(--rosa-borde);border-radius:10px;padding:10px 12px;min-width:0;width:100%;font-size:16px;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}
textarea{min-height:70px}
.btn{border:1px solid var(--rosa-borde);background:#fff;padding:10px 16px;border-radius:10px;cursor:pointer;font-size:15px}
.btn:hover{background:var(--rosa)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;letter-spacing:.03em}
.btn.pri:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.big{padding:14px 20px;font-size:1.05rem}
.btn:disabled{opacity:.5;cursor:default}
.btn.danger{color:var(--bad);border-color:#f1c9c6}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat b{display:block;font-size:28px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:13px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;margin-top:12px}
.chip{border:0;border-radius:10px;padding:8px 4px;font-size:.82rem;cursor:pointer;text-align:center;line-height:1.2;font-weight:500}
.chip small{display:block;font-size:.7rem;opacity:.85;font-weight:400}
.chip:hover{filter:brightness(.97)}
.c-falta{background:var(--falta);color:var(--falta-ink)}
.c-pendiente{background:var(--pend);color:var(--pend-ink);box-shadow:inset 0 0 0 1px var(--oro-suave)}
.c-firmado{background:var(--ok);color:var(--ok-ink)}
.c-firmado_papel{background:var(--papel);color:var(--papel-ink)}
.c-disc{box-shadow:inset 0 0 0 2px var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.tablewrap{overflow-x:auto}
.empbtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.pdfview{background:var(--rosa);border:1px solid var(--rosa-borde);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:8px;max-height:65vh;overflow:auto}
.pdfview p{color:var(--muted)!important}
.pdfview canvas{width:100%;height:auto;background:#fff;border-radius:4px;box-shadow:0 1px 4px rgba(200,24,106,.12)}
.pdfview img{width:100%;background:#fff}
.sigwrap{border:2px dashed var(--rosa-borde);border-radius:12px;background:#fff;position:relative}
.sigwrap canvas{width:100%;height:200px;display:block;touch-action:none;border-radius:10px}
.sigwrap .ph{position:absolute;left:12px;bottom:10px;color:#c9b3bd;font-size:.85rem;pointer-events:none}
.pin{letter-spacing:.5em;text-align:center;font-size:1.4rem;max-width:220px}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{flex:1 1 200px;border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:#fff}
.opt input{margin-right:6px}
.opt:has(input:checked){border-color:var(--accent);background:var(--rosa)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;z-index:50;max-width:90vw}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink);width:min(520px,92vw);padding:18px;box-shadow:0 10px 40px rgba(200,24,106,.15)}
dialog::backdrop{background:rgba(34,28,31,.35)}
.drop{border:2px dashed var(--rosa-borde);border-radius:var(--r);padding:22px;text-align:center;cursor:pointer;background:#fff}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--rosa)}
.st-ok{color:var(--ok-ink)} .st-err{color:var(--bad)}
.hide{display:none!important}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-all}
.login-logo{display:block;width:150px;max-width:100%;margin:0 auto 12px;border-radius:8px}
.barra-nav:has(nav.hide){display:none}
/* Calendario de horarios */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.cal-h{font-size:12px;color:var(--muted);text-align:center;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding-bottom:2px}
.cal-d{min-height:58px;border:1px solid var(--line);background:#fff;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;padding:4px 2px;color:var(--ink)}
.cal-d .n{font-weight:600;font-size:15px}
.cal-d .h{font-size:12px;font-variant-numeric:tabular-nums;font-weight:500}
.cal-d:hover:not(:disabled){border-color:var(--accent)}
.cal-d.hoy{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-d.off{background:transparent;color:#d4c8ce;cursor:default;border-color:transparent}
.h-cargado{background:var(--pend);color:var(--pend-ink);border-color:var(--oro-suave)}
.h-aprobado{background:var(--ok);color:var(--ok-ink);border-color:#bfe0c9}
.h-rechazado{background:#fde8e6;color:var(--bad);border-color:#f1a9a2}
.hx{display:flex;gap:8px;align-items:stretch}
.hx input{text-align:center;font-size:26px!important;font-weight:700;padding:8px!important}
.hx-b{min-width:56px;font-size:24px;font-weight:600;padding:0}
.hx-r{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.hx-r .btn{padding:8px 0;font-size:14px}
.plata{border-color:var(--oro-suave);background:#fffdf7}
.granTotal{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--rosa);border:1px solid var(--rosa-borde)}
.granTotal b{font-size:24px;color:var(--accent)}
.btn.mini{padding:3px 10px;font-size:13px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-size:12.5px;cursor:pointer;text-align:left}
.linkbtn:hover{text-decoration:underline}
.hgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.hgrid input{text-align:center;padding:8px 2px!important}
tr.tot td{font-weight:700;border-top:2px solid var(--oro-suave);border-bottom:0}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid}
.empchips{display:flex;gap:6px;flex-wrap:wrap}
.empchips button{border:1px solid var(--rosa-borde);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font-size:15px}
.empchips button:hover{background:var(--rosa)}
.empchips button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.empchips .badge{display:inline-block;min-width:18px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--oro);color:#fff;font-size:11px;font-weight:700;line-height:18px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.banner{padding:10px 14px;border-radius:10px;font-size:14px;background:#fbf4e3;border:1px solid var(--oro-suave)}
.banner a{color:var(--accent)}
@media(max-width:520px){ .cal{gap:4px} .cal-d{min-height:48px;border-radius:8px} .cal-d .n{font-size:14px} .cal-d .h{font-size:11px} nav button{font-size:13px;padding:7px 4px} }
.login-card{box-shadow:0 10px 40px rgba(200,24,106,.12)}
</style>
</head>
<body>
<header>
  <div class="cartel">
    <img class="flor izq" src="assets/peonia-izq.jpg" alt="">
    <div class="marca">
      <h1 class="nombre">LILÉN MÁRQUEZ</h1>
      <div class="sub">INDUMENTARIA <b>♡</b> RECIBOS</div>
    </div>
    <img class="flor der" src="assets/peonia-der.jpg" alt="">
  </div>
  <div class="barra-nav" id="barra">
  <nav id="nav" class="hide"></nav>
  </div>
</header>
<main id="app"><p class="muted">Cargando…</p></main>
<dialog id="dlg"></dialog>

<script>
// ===== Config =====
const SB_URL = 'https://jqqtjygmdoadofarnbco.supabase.co';
const SB_KEY = 'sb_publishable_5fSvvUgb3kU5zIxmQFWJHg_CKP508Do';
const EMPRESA = 'Vega Oriana Graciela - CUIT 27-39921272-9';
const INICIO = '2025-03-01';
const BUCKET = 'recibos';
const DOMINIO = 'recibos.lilen'; // dominio interno: "meli" -> meli@recibos.lilen
const aEmail = u => { u = String(u||'').trim().toLowerCase(); return !u ? '' : u.includes('@') ? u : `${u}@${DOMINIO}`; };
const aUsuario = m => { m = String(m||'').toLowerCase(); return m.endsWith('@'+DOMINIO) ? m.slice(0, -DOMINIO.length-1) : m; };
const sb = supabase.createClient(SB_URL, SB_KEY);
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MES_L = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const TIPOS = {mensual:'Mensual', sac:'Aguinaldo (SAC)', vacaciones:'Vacaciones', final:'Liquidación final', otro:'Otro'};
const ESTADOS = {falta:'Sin cargar', pendiente:'Pendiente', firmado:'Firmado', firmado_papel:'Firmado en papel'};

let S = { email:null, emps:[], recs:[], view:'tablero', firma:null };
const app = document.getElementById('app');
const dlg = document.getElementById('dlg');

// ===== Helpers =====
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pKey = (y,m) => `${y}-${String(m).padStart(2,'0')}-01`;
const pLabel = p => { const [y,m] = p.split('-'); return `${MES[+m-1]} ${y.slice(2)}`; };
const pLong = p => { const [y,m] = p.split('-'); return `${MES_L[+m-1]} ${y}`; };
const hoyP = () => { const d = new Date(); return pKey(d.getFullYear(), d.getMonth()+1); };
function mesesEntre(a, b){ const out=[]; let [y,m]=a.split('-').map(Number); const [by,bm]=b.split('-').map(Number);
  while(y<by || (y===by && m<=bm)){ out.push(pKey(y,m)); m++; if(m>12){m=1;y++;} } return out; }
function sumarMes(p, n){ let [y,m]=p.split('-').map(Number); m+=n; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return pKey(y,m); }
function toast(msg, ms=2600){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms); }
async function sha256(buf){ const h = await crypto.subtle.digest('SHA-256', buf); return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join(''); }
const rnd = () => Math.random().toString(36).slice(2,8);
const fmtFecha = d => new Date(d).toLocaleString('es-AR', {timeZone:'America/Argentina/Buenos_Aires', dateStyle:'short', timeStyle:'short'});
const empById = id => S.emps.find(e => e.id === id);
const errMsg = e => (e && (e.message || e.error_description)) || String(e);
function winAnsi(s){ return String(s ?? '').normalize('NFC').replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/[\u2013\u2014]/g,'-').replace(/\u2026/g,'...').replace(/[^\x20-\x7E\xA0-\xFF]/g,''); }

async function bajar(path){ const {data, error} = await sb.storage.from(BUCKET).download(path); if(error) throw error; return data; }
async function abrirArchivo(path){
  const w = window.open('', '_blank');
  try { const blob = await bajar(path); const url = URL.createObjectURL(blob); if(w) w.location = url; else location.href = url; }
  catch(e){ if(w) w.close(); toast('No se pudo abrir: ' + errMsg(e)); }
}

// ===== Auth =====
async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) return vistaLogin();
  S.email = session.user.email;
  const { data:esAdmin } = await sb.rpc('es_admin');
  if(!esAdmin){
    const { data:yo } = await sb.rpc('rec_mi_empleada');
    if(yo){ S.yo = yo; if(!session.user.user_metadata?.clave_propia) return vCambiarClave(yo, true); return vMisRecibos(yo); }
    app.innerHTML = `<div class="card"><h2>Sin acceso</h2><p>La cuenta ${esc(S.email)} no tiene recibos asociados.</p><button class="btn" onclick="salir()">Salir</button></div>`; return;
  }
  await cargarDatos();
  setNav(NAV_ADMIN, S.view);
  ir(S.view);
}
function vistaLogin(){
  document.getElementById('nav').classList.add('hide');
  app.innerHTML = `<div class="card login-card" style="max-width:360px;margin:30px auto">
    <img src="assets/logo.jpg" alt="Lilén Márquez Indumentaria" class="login-logo">
    <h2 style="text-align:center">Recibos de sueldo</h2>
    <form id="fl" class="row" style="flex-direction:column;align-items:stretch">
      <label class="f">Usuario o email<input type="text" name="e" required autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"></label>
      <label class="f">Contraseña<input type="password" name="p" required autocomplete="current-password"></label>
      <button class="btn pri">Entrar</button><p id="le" class="st-err"></p>
    </form></div>`;
  document.getElementById('fl').onsubmit = async ev => {
    ev.preventDefault(); const f = ev.target;
    const { error } = await sb.auth.signInWithPassword({ email:aEmail(f.e.value), password:f.p.value });
    if(error) document.getElementById('le').textContent = error.code==='invalid_credentials' ? 'Usuario o contraseña incorrectos' : 'No pudimos entrar: ' + error.message; else init();
  };
}
async function salir(){ await sb.auth.signOut(); S = { ...S, email:null, emps:[], recs:[], firma:null }; vistaLogin(); }

async function cargarDatos(){
  const [e, r] = await Promise.all([
    sb.from('rec_empleadas').select('id,nombre,cuil,email,activa,ingreso,egreso,creado').order('nombre'),
    sb.from('rec_recibos').select('*').order('periodo')
  ]);
  if(e.error) throw e.error; if(r.error) throw r.error;
  S.emps = e.data; S.recs = r.data;
}

const NAV_ADMIN = [['tablero','Tablero'],['cargar','Cargar'],['horarios','Horas extras'],['empleadas','Empleadas'],['exportar','Exportar']];
const NAV_EMP = [['recibos','Mis recibos'],['horas','Mis horas extras']];
function setNav(items, on){
  const n = document.getElementById('nav');
  n.innerHTML = items.map(([k,t]) => `<button data-v="${k}" class="${k===on?'on':''}">${t}</button>`).join('');
  n.classList.remove('hide');
  n.querySelectorAll('button').forEach(b => b.onclick = () => ir(b.dataset.v));
}
function ir(v){
  S.view = v;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  correr(({tablero:vTablero, cargar:vCargar, horarios:vHorarios, empleadas:vEmpleadas, exportar:vExportar,
    recibos:() => vMisRecibos(S.yo), horas:() => vMisHoras()})[v]);
  window.scrollTo(0,0);
}

// ===== Tablero =====
function rangoEmp(e){
  let desde = INICIO; if(e.ingreso){ const i = e.ingreso.slice(0,7)+'-01'; if(i > desde) desde = i; }
  let hasta = sumarMes(hoyP(), -1); // el mes en curso todavía no se liquida
  if(e.egreso){ const g = e.egreso.slice(0,7)+'-01'; if(g < hasta) hasta = g; }
  const recsE = S.recs.filter(r => r.empleada_id === e.id && r.tipo==='mensual');
  if(recsE.length){ const min = recsE[0].periodo, max = recsE[recsE.length-1].periodo; if(min < desde) desde = min; if(max > hasta) hasta = max; }
  return desde <= hasta ? mesesEntre(desde, hasta) : [];
}
function vTablero(){
  const activas = S.emps.filter(e => e.activa);
  if(!S.emps.length){ app.innerHTML = `<div class="card"><h2>Arranquemos</h2><p>Primero cargá a las empleadas.</p><button class="btn pri" onclick="ir('empleadas')">Cargar empleadas</button></div>`; return; }
  let falta=0, pend=0, ok=0, papel=0;
  const bloques = activas.map(e => {
    const meses = rangoEmp(e);
    const mapa = {}; S.recs.filter(r => r.empleada_id===e.id && r.tipo==='mensual').forEach(r => mapa[r.periodo] = r);
    const chips = meses.map(p => {
      const r = mapa[p]; const st = r ? r.estado : 'falta';
      if(st==='falta') falta++; else if(st==='pendiente') pend++; else if(st==='firmado') ok++; else papel++;
      const disc = r && r.conformidad==='disconforme' ? ' c-disc' : '';
      return `<button class="chip c-${st}${disc}" data-e="${e.id}" data-p="${p}" data-t="mensual">${pLabel(p)}<small>${ESTADOS[st]}</small></button>`;
    }).join('');
    const otros = S.recs.filter(r => r.empleada_id===e.id && r.tipo!=='mensual').map(r => {
      if(r.estado==='pendiente') pend++; else if(r.estado==='firmado') ok++; else papel++;
      return `<button class="chip c-${r.estado}" data-e="${e.id}" data-p="${r.periodo}" data-t="${r.tipo}">${TIPOS[r.tipo]}<small>${pLabel(r.periodo)}</small></button>`;
    }).join('');
    const nPend = S.recs.filter(r => r.empleada_id===e.id && r.estado==='pendiente').length;
    return `<div class="card"><div class="row"><h3 class="grow">${esc(e.nombre)}</h3>
      ${!e.email ? '<span class="st-err" style="font-size:.85rem">Sin usuario: no puede firmar</span>' : nPend ? `<span class="muted" style="font-size:.85rem">${nPend} por firmar</span>` : ''}</div>
      ${chips ? `<div class="chips">${chips}</div>` : `<p class="muted" style="margin:10px 0 0;font-size:.9rem">Todavía no tiene meses para firmar${e.ingreso ? ` (ingresó en ${pLong(e.ingreso.slice(0,7)+"-01")})` : ""}.</p>`}${otros ? `<p class="muted" style="margin:12px 0 0;font-size:.85rem">Otros recibos</p><div class="chips">${otros}</div>` : ''}</div>`;
  }).join('');
  app.innerHTML = `<div class="stats">
      <div class="stat"><b>${pend}</b><span class="muted">Pendientes de firma</span></div>
      <div class="stat"><b>${falta}</b><span class="muted">Meses sin cargar</span></div>
      <div class="stat"><b>${ok}</b><span class="muted">Firmados en pantalla</span></div>
      <div class="stat"><b>${papel}</b><span class="muted">Firmados en papel</span></div></div>
    <div class="legend" style="margin-bottom:12px">
      <span style="--c:var(--falta)">Sin cargar</span><span style="--c:var(--pend)">Pendiente</span>
      <span style="--c:var(--ok)">Firmado</span><span style="--c:var(--papel)">Papel</span><span style="--c:var(--bad)">Borde rojo: disconforme</span></div>
    ${bloques}${S.emps.length>activas.length?`<p class="muted">Hay ${S.emps.length-activas.length} empleada(s) inactiva(s); sus recibos siguen en Exportar.</p>`:''}`;
  app.querySelectorAll('.chip').forEach(c => c.onclick = () => detalle(c.dataset.e, c.dataset.p, c.dataset.t));
}

function detalle(eid, p, tipo){
  const e = empById(eid); const r = S.recs.find(x => x.empleada_id===eid && x.periodo===p && x.tipo===tipo);
  let body;
  if(!r){
    body = `<p>No hay recibo cargado para este mes.</p><div class="row"><button class="btn pri" id="d-cargar">Cargar este mes</button></div>`;
  } else {
    body = `<dl class="kv"><dt>Estado</dt><dd>${ESTADOS[r.estado]}${r.conformidad?` · ${r.conformidad}`:''}</dd>
      ${r.observacion?`<dt>Observación</dt><dd>${esc(r.observacion)}</dd>`:''}
      ${r.firmado_en?`<dt>Firmado</dt><dd>${fmtFecha(r.firmado_en)}${r.firmado_ante?` · ante ${esc(r.firmado_ante)}`:''}</dd>`:''}
      <dt>Cargado</dt><dd>${fmtFecha(r.creado)}</dd><dt>SHA-256</dt><dd style="font-size:.75rem">${r.pdf_sha256}</dd></dl>
      <div class="row" style="margin-top:14px">
        ${r.firmado_pdf_path?`<button class="btn pri" data-open="${esc(r.firmado_pdf_path)}">Ver firmado</button>`:''}
        ${r.firmado_pdf_path!==r.pdf_path?`<button class="btn" data-open="${esc(r.pdf_path)}">Ver original</button>`:''}
        ${r.estado==='pendiente'?`<button class="btn" id="d-papel">Subir firmado en papel</button>
          <button class="btn danger" id="d-borrar">Borrar</button>`:''}
      </div>`;
  }
  dlg.innerHTML = `<div class="row"><h2 class="grow">${esc(e.nombre)} · ${TIPOS[tipo]} ${pLong(p)}</h2><button class="btn" id="d-x">✕</button></div>${body}`;
  dlg.showModal();
  dlg.querySelector('#d-x').onclick = () => dlg.close();
  dlg.querySelectorAll('[data-open]').forEach(b => b.onclick = () => abrirArchivo(b.dataset.open));
  const q = id => dlg.querySelector(id);
  if(q('#d-cargar')) q('#d-cargar').onclick = () => { dlg.close(); S.prefill = { emp:eid, periodo:p }; ir('cargar'); };
  if(q('#d-borrar')) q('#d-borrar').onclick = async () => {
    if(!confirm('¿Borrar este recibo pendiente?')) return;
    const { error } = await sb.from('rec_recibos').delete().eq('id', r.id);
    if(error) return toast(errMsg(error));
    await sb.storage.from(BUCKET).remove([r.pdf_path]);
    dlg.close(); await cargarDatos(); vTablero(); toast('Borrado');
  };
  if(q('#d-papel')) q('#d-papel').onclick = () => {
    const inp = document.createElement('input'); inp.type='file'; inp.accept='application/pdf,image/jpeg,image/png';
    inp.onchange = async () => {
      const f = inp.files[0]; if(!f) return;
      try {
        const ext = (f.name.split('.').pop()||'pdf').toLowerCase();
        const path = `papel/${eid}/${r.periodo.slice(0,7)}_${r.tipo}_${rnd()}.${ext}`;
        const up = await sb.storage.from(BUCKET).upload(path, f, { contentType:f.type });
        if(up.error) throw up.error;
        const h = await sha256(await f.arrayBuffer());
        const { error } = await sb.from('rec_recibos').update({ estado:'firmado_papel', firmado_pdf_path:path, firmado_pdf_sha256:h, firmado_en:new Date().toISOString(), firmado_ante:S.email }).eq('id', r.id);
        if(error) throw error;
        dlg.close(); await cargarDatos(); vTablero(); toast('Guardado como firmado en papel');
      } catch(e){ toast('Error: ' + errMsg(e)); }
    };
    inp.click();
  };
}

// ===== Cargar =====
let cola = [];
function periodoDeNombre(n){
  n = n.toLowerCase();
  let m = n.match(/(20\d\d)[-_. ]?(0[1-9]|1[0-2])(?!\d)/); if(m) return pKey(+m[1], +m[2]);
  m = n.match(/(?<!\d)(0?[1-9]|1[0-2])[-_. ](20\d\d)/); if(m) return pKey(+m[2], +m[1]);
  for(let i=0;i<12;i++){ const re = new RegExp(MES_L[i].slice(0,3)+'[a-z]*[-_. ]*(20\\d\\d|\\d\\d)(?!\\d)'); m = n.match(re); if(m){ let y=+m[1]; if(y<100) y+=2000; return pKey(y, i+1); } }
  return null;
}
function vCargar(){
  const pre = S.prefill || {}; S.prefill = null;
  const opts = S.emps.filter(e=>e.activa).map(e => `<option value="${e.id}" ${pre.emp===e.id?'selected':''}>${esc(e.nombre)}</option>`).join('');
  if(!opts){ app.innerHTML = `<div class="card"><p>Primero cargá una empleada.</p><button class="btn pri" onclick="ir('empleadas')">Empleadas</button></div>`; return; }
  cola = [];
  app.innerHTML = `<div class="card"><h2>Cargar recibos</h2>
    <div class="row">
      <label class="f grow">Empleada<select id="c-emp">${opts}</select></label>
      <label class="f grow">Primer período<input type="month" id="c-per" value="${(pre.periodo||sumarMes(hoyP(),-1)).slice(0,7)}"></label>
      <label class="f grow">Tipo<select id="c-tipo">${Object.entries(TIPOS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label>
    </div>
    <p><label><input type="checkbox" id="c-papel"> Ya están firmados en papel (subo el escaneo o la foto)</label></p>
    <div class="drop" id="drop"><b>Tocá para elegir archivos</b><br><span class="muted">o arrastralos acá · PDF (o foto si ya están firmados)</span></div>
    <input type="file" id="c-files" multiple accept="application/pdf,image/jpeg,image/png" class="hide">
    <p class="muted" style="font-size:.85rem">Si el nombre del archivo trae el mes (ej. <i>recibo_2025-12.pdf</i> o <i>dic-2025</i>) lo tomo de ahí; si no, voy sumando un mes desde el primer período en el orden de los nombres.</p>
    <div id="lista"></div></div>`;
  const drop = document.getElementById('drop'), inp = document.getElementById('c-files');
  drop.onclick = () => inp.click();
  drop.ondragover = ev => { ev.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = ev => { ev.preventDefault(); drop.classList.remove('over'); agregar([...ev.dataTransfer.files]); };
  inp.onchange = () => { agregar([...inp.files]); inp.value=''; };
  ['c-emp','c-per','c-tipo'].forEach(id => document.getElementById(id).onchange = recalcular);
}
function agregar(files){
  files = files.filter(f => /pdf|jpeg|png/.test(f.type)).sort((a,b)=>a.name.localeCompare(b.name, 'es', {numeric:true}));
  files.forEach(f => cola.push({ file:f, emp:null, periodo:null, auto:periodoDeNombre(f.name), tipo:null, st:'' }));
  recalcular();
}
function recalcular(){
  const emp = document.getElementById('c-emp').value, base = document.getElementById('c-per').value+'-01', tipo = document.getElementById('c-tipo').value;
  let k = 0;
  cola.forEach(c => { if(c.st==='ok') return; c.emp = c.empManual || emp; c.tipo = c.tipoManual || tipo; c.periodo = c.perManual || c.auto || sumarMes(base, k++); });
  pintarCola();
}
function pintarCola(){
  const el = document.getElementById('lista'); if(!cola.length){ el.innerHTML=''; return; }
  const empOpts = sel => S.emps.filter(e=>e.activa).map(e=>`<option value="${e.id}" ${sel===e.id?'selected':''}>${esc(e.nombre)}</option>`).join('');
  el.innerHTML = `<div class="tablewrap" style="margin-top:14px"><table><tr><th>Archivo</th><th>Empleada</th><th>Período</th><th>Tipo</th><th></th></tr>
    ${cola.map((c,i)=>{ const dup = S.recs.some(r=>r.empleada_id===c.emp && r.periodo===c.periodo && r.tipo===c.tipo);
      return `<tr><td style="max-width:180px;word-break:break-all">${esc(c.file.name)}</td>
      <td><select data-i="${i}" data-k="emp" ${c.st==='ok'?'disabled':''}>${empOpts(c.emp)}</select></td>
      <td><input type="month" data-i="${i}" data-k="per" value="${c.periodo.slice(0,7)}" ${c.st==='ok'?'disabled':''}></td>
      <td><select data-i="${i}" data-k="tipo" ${c.st==='ok'?'disabled':''}>${Object.entries(TIPOS).map(([k,v])=>`<option value="${k}" ${c.tipo===k?'selected':''}>${v}</option>`).join('')}</select></td>
      <td>${c.st==='ok'?'<span class="st-ok">✓ Subido</span>':c.st?`<span class="st-err">${esc(c.st)}</span>`:dup?'<span class="st-err">Ya existe</span>':`<button class="btn" data-x="${i}">✕</button>`}</td></tr>`; }).join('')}
    </table></div><p class="row" style="margin-top:14px"><button class="btn pri big" id="subir">Subir ${cola.filter(c=>c.st!=='ok').length} recibo(s)</button><button class="btn" id="limpiar">Limpiar lista</button></p>`;
  el.querySelectorAll('[data-k]').forEach(x => x.onchange = () => { const c = cola[x.dataset.i];
    if(x.dataset.k==='emp') c.empManual = x.value; if(x.dataset.k==='per') c.perManual = x.value+'-01'; if(x.dataset.k==='tipo') c.tipoManual = x.value; recalcular(); });
  el.querySelectorAll('[data-x]').forEach(x => x.onclick = () => { cola.splice(+x.dataset.x,1); recalcular(); });
  document.getElementById('limpiar').onclick = () => { cola=[]; pintarCola(); };
  document.getElementById('subir').onclick = subirCola;
}
async function subirCola(){
  const papel = document.getElementById('c-papel').checked;
  const btn = document.getElementById('subir'); btn.disabled = true; btn.textContent = 'Subiendo…';
  for(const c of cola){
    if(c.st==='ok') continue;
    try {
      const isPdf = c.file.type === 'application/pdf';
      if(!papel && !isPdf) throw new Error('Para firmar en pantalla tiene que ser PDF');
      const buf = await c.file.arrayBuffer(); const h = await sha256(buf);
      const ext = isPdf ? 'pdf' : (c.file.type==='image/png'?'png':'jpg');
      const path = `originales/${c.emp}/${c.periodo.slice(0,7)}_${c.tipo}_${rnd()}.${ext}`;
      const up = await sb.storage.from(BUCKET).upload(path, c.file, { contentType:c.file.type }); if(up.error) throw up.error;
      const row = { empleada_id:c.emp, periodo:c.periodo, tipo:c.tipo, pdf_path:path, pdf_sha256:h, estado: papel?'firmado_papel':'pendiente' };
      if(papel){ row.firmado_pdf_path = path; row.firmado_pdf_sha256 = h; row.observacion = 'Cargado como firmado en papel'; }
      const ins = await sb.from('rec_recibos').insert(row);
      if(ins.error){ await sb.storage.from(BUCKET).remove([path]); if(ins.error.code==='23505') throw new Error('Ya existe ese mes'); throw ins.error; }
      c.st = 'ok';
    } catch(e){ c.st = errMsg(e); }
  }
  await cargarDatos(); pintarCola();
  const n = cola.filter(c=>c.st==='ok').length; toast(`${n} recibo(s) subidos`);
}

      <div class="sigwrap"><canvas id="sig"></canvas><span class="ph" id="sigph">Firma</span></div>
      <div class="row" style="margin-top:12px"><button class="btn" id="sigclr">Borrar firma</button><span class="grow"></span>
        <button class="btn" onclick="if(confirm('¿Dejar para después? Lo que falte queda pendiente.')){S.firma=null;vMisRecibos(YO.id)}">Después</button>
        <button class="btn pri big" id="ok" disabled>Firmar recibo</button></div>
      <p id="fe" class="st-err"></p></div>`;
  let bytes;
  try {
    const blob = await bajar(r.pdf_path); bytes = await blob.arrayBuffer();
    if(await sha256(bytes) !== r.pdf_sha256) throw new Error('El archivo no coincide con el que se cargó. Avisale a la encargada.');
    const pdf = await pdfjsLib.getDocument({ data: bytes.slice(0) }).promise;
    const pv = document.getElementById('pv'); pv.innerHTML = '';
    for(let n=1;n<=pdf.numPages;n++){
      const pg = await pdf.getPage(n); const vp = pg.getViewport({ scale: 2 });
      const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height; pv.appendChild(cv);
      await pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
    }
  } catch(e){ document.getElementById('pv').innerHTML = `<p style="color:#fff">No se pudo mostrar: ${esc(errMsg(e))}</p>`; return; }
  const cv = document.getElementById('sig'); const ctx = cv.getContext('2d'); let trazos = 0, dib = false;
  const d = window.devicePixelRatio||1; cv.width = cv.clientWidth*d; cv.height = cv.clientHeight*d; ctx.setTransform(d,0,0,d,0,0);
  ctx.lineWidth = 2.4; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#111';
  const pos = ev => { const b = cv.getBoundingClientRect(); return [ev.clientX-b.left, ev.clientY-b.top]; };
  cv.onpointerdown = ev => { dib = true; cv.setPointerCapture(ev.pointerId); ctx.beginPath(); ctx.moveTo(...pos(ev)); };
  cv.onpointermove = ev => { if(!dib) return; ctx.lineTo(...pos(ev)); ctx.stroke(); };
  cv.onpointerup = cv.onpointercancel = () => { if(dib){ trazos++; document.getElementById('sigph').classList.add('hide'); chk(); } dib = false; };
  document.getElementById('sigclr').onclick = () => { ctx.clearRect(0,0,cv.width,cv.height); document.getElementById('sigph').classList.remove('hide'); trazos = 0; chk(); };
  const conf = () => app.querySelector('input[name=conf]:checked').value;
  app.querySelectorAll('input[name=conf]').forEach(x => x.onchange = () => { document.getElementById('obsw').classList.toggle('hide', conf()!=='disconforme'); chk(); });
  document.getElementById('leido').onchange = chk;
  document.getElementById('obs').oninput = chk;
  function chk(){ const b = document.getElementById('ok'); if(!b) return;
    b.disabled = !(trazos>0 && document.getElementById('leido').checked && (conf()==='conforme' || document.getElementById('obs').value.trim())); }
  document.getElementById('ok').onclick = async () => {
    const b = document.getElementById('ok'); b.disabled = true; b.textContent = 'Firmando…';
    try {
      const firmaBlob = await new Promise(res => cv.toBlob(res, 'image/png'));
      await firmarRecibo(r, YO, conf(), document.getElementById('obs').value, firmaBlob, bytes);
      F.hechos++; F.i++; toast('Recibo firmado ✓'); pantallaRecibo();
    } catch(e){ document.getElementById('fe').textContent = 'No se pudo firmar: ' + errMsg(e); b.disabled = false; b.textContent = 'Firmar recibo'; }
  };
}

async function firmarRecibo(r, e, conformidad, obs, firmaBlob, origBytes){
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const ahora = new Date(); const ua = navigator.userAgent;
  const doc = await PDFDocument.load(origBytes, { ignoreEncryption:true });
  const page = doc.addPage([595.28, 841.89]);
  const font = await doc.embedFont(StandardFonts.Helvetica), bold = await doc.embedFont(StandardFonts.HelveticaBold);
  let y = 790; const X = 56, W = 595.28 - 2*X;
  const linea = (txt, o={}) => { const f = o.bold?bold:font, sz = o.size||10.5;
    const words = winAnsi(txt).split(' '); let l = '';
    const out = []; for(const w of words){ const t = l ? l+' '+w : w; if(f.widthOfTextAtSize(t, sz) > W && l){ out.push(l); l = w; } else l = t; } if(l) out.push(l);
    out.forEach(s => { page.drawText(s, { x:X, y, size:sz, font:f, color:rgb(.1,.1,.1) }); y -= sz*1.45; }); y -= (o.after||4); };
  linea('CONSTANCIA DE FIRMA ELECTRÓNICA DE RECIBO DE HABERES', { bold:true, size:13, after:10 });
  linea(`Empleador: ${EMPRESA}`);
  linea(`Trabajadora: ${e.nombre}${e.cuil?` - CUIL ${e.cuil}`:''}`);
  linea(`Recibo: ${TIPOS[r.tipo]} - período ${pLong(r.periodo)}`, { after:10 });
  linea('Declaro haber recibido este recibo de haberes y quedo notificada de su contenido.', { after:6 });
  linea(conformidad==='conforme' ? 'Manifestación: CONFORME.' : 'Manifestación: EN DISCONFORMIDAD (arts. 58 y 260 de la Ley de Contrato de Trabajo).', { bold:true });
  if(conformidad==='disconforme' && obs.trim()) linea(`Observación de la trabajadora: ${obs.trim()}`);
  y -= 8;
  linea(`Fecha y hora de firma: ${fmtFecha(ahora)} (hora de Buenos Aires, según el dispositivo; el registro del servidor queda en la base de datos)`);
  linea(`Identificación: ingreso con usuario personal de la trabajadora (${aUsuario(S.email)}) y contraseña elegida por ella.`);
  linea(`Dispositivo: ${ua}`, { size:8.5 });
  linea('Huella SHA-256 del recibo original (páginas anteriores):', { after:0 });
  linea(r.pdf_sha256, { size:8.5, after:16 });
  linea('Firma de la trabajadora:', { bold:true, after:4 });
  const png = await doc.embedPng(await firmaBlob.arrayBuffer());
  const k = Math.min(260/png.width, 110/png.height);
  page.drawImage(png, { x:X, y:y-png.height*k, width:png.width*k, height:png.height*k });
  y -= png.height*k + 6;
  page.drawLine({ start:{x:X,y}, end:{x:X+260,y}, thickness:.6, color:rgb(.4,.4,.4) }); y -= 14;
  linea(e.nombre, { size:9.5 });
  doc.setTitle(winAnsi(`Recibo ${pLong(r.periodo)} - ${e.nombre} - firmado`)); doc.setProducer('Lilen Recibos');
  const out = await doc.save(); const hOut = await sha256(out);
  const base = `${e.id}/${r.periodo.slice(0,7)}_${r.tipo}_${Date.now()}`;
  const fPath = `firmas/${base}.png`, pPath = `firmados/${base}.pdf`;
  let up = await sb.storage.from(BUCKET).upload(fPath, firmaBlob, { contentType:'image/png' }); if(up.error) throw up.error;
  up = await sb.storage.from(BUCKET).upload(pPath, new Blob([out], {type:'application/pdf'}), { contentType:'application/pdf' }); if(up.error) throw up.error;
  const { error } = await sb.rpc('rec_firmar_propio', { p_recibo:r.id, p_conformidad:conformidad, p_observacion:obs||'', p_firma_path:fPath, p_firmado_pdf_path:pPath, p_firmado_sha256:hOut, p_ua:ua });
  if(error) throw error;
}

// ===== Horas extras =====
const DIAS = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const H_EST = {cargado:'Por revisar', aprobado:'Aprobado', rechazado:'Rechazado'};
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const pDate = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = pDate(s); d.setDate(d.getDate()+n); return ymd(d); };
const dow = s => (pDate(s).getDay()+6)%7; // 0 = lunes
const hoyStr = () => ymd(new Date());
const fHs = n => { n = Math.round(Number(n)*10)/10; return `${String(n).replace('.',',')} h`; };
const sumaHs = rs => rs.reduce((a,r) => a + Number(r.horas), 0);
const fLarga = s => pDate(s).toLocaleDateString('es-AR', { weekday:'long', day:'numeric', month:'long' });
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const finMes = mes => addDays(sumarMes(mes,1), -1);

async function traerHoras(eid, desde, hasta){
  const { data, error } = await sb.from('rec_horas').select('*').eq('empleada_id', eid).gte('fecha', desde).lte('fecha', hasta).order('fecha');
  if(error) throw error;
  const m = {}; data.forEach(r => m[r.fecha] = r); return m;
}

function calendario(mes, horas, bloqueado){
  const ultimo = finMes(mes), hoy = hoyStr();
  let html = `<div class="cal">${DIAS.map(d => `<div class="cal-h">${d}</div>`).join('')}`;
  for(let i=0; i<dow(mes); i++) html += '<div></div>';
  for(let f = mes; f <= ultimo; f = addDays(f,1)){
    const r = horas[f], off = f > hoy || (!r && bloqueado && bloqueado(f));
    const cls = ['cal-d', r ? 'h-'+r.estado : '', off ? 'off' : '', f===hoy ? 'hoy' : ''].join(' ');
    html += `<button class="${cls}" data-f="${f}" ${off?'disabled':''} title="${r?H_EST[r.estado]:''}"><span class="n">${+f.slice(8)}</span>${r ? `<span class="h">+${fHs(r.horas)}</span>` : ''}</button>`;
  }
  return html + '</div>';
}
const leyendaH = () => `<div class="legend" style="margin-top:10px">
  <span style="--c:var(--pend)">Por revisar</span><span style="--c:var(--ok)">Aprobado</span><span style="--c:#f6c9c4">Rechazado</span></div>`;

                : `<button type="button" class="btn pri big" data-a="guardar">Guardar</button>`}

  dlg.querySelectorAll('[data-a]').forEach(b => b.onclick = async () => {
    const a = b.dataset.a; de.textContent = '';

  });
  if(!ro) setTimeout(() => inp.focus(), 50);
}

  const c = {}; cfg.data.forEach(x => c[x.clave] = Number(x.valor));
  const vh = c.valor_hora_extra ?? 0, vn = c.valor_hora_normal ?? 0;
  const horario = {}; suel.data.forEach(x => horario[x.empleada_id] = x.horario || {});
  // Horas normales del mes según su horario, desde que ingresó y hasta que se fue
  const normales = e => {
    const h = horario[e.id]; if(!h) return null;
    let desde = HA.mes, hasta = ultimoDia, t = 0;
    if(e.ingreso && e.ingreso > desde) desde = e.ingreso;
    if(e.egreso && e.egreso < hasta) hasta = e.egreso;
    for(let f = desde; f <= hasta; f = addDays(f,1)) t += Number(h[dow(f)] || 0);
    return t;
  };
  const resumenHorario = h => !h ? '' : DIAS.map((d,i) => h[i] ? `${d} ${String(h[i]).replace('.',',')}h` : '').filter(Boolean).join(' · ');
  const filas = activas.map(e => {
    const mias = hs.data.filter(x => x.empleada_id === e.id);
    const apr = sumaHs(mias.filter(x => x.estado==='aprobado')), rev = sumaHs(mias.filter(x => x.estado==='cargado'));
    const hn = normales(e);
    return { e, apr, rev, hn, sueldo: hn != null ? hn*vn : null };
  });
  const T = k => filas.reduce((a,x) => a + (x[k] || 0), 0);
  const tot = x => (x.sueldo || 0) + x.apr*vh;
  // Personal sin usuario: se paga por semana (cada sábado), por día o por mes
  let semanas = 0; for(let f = HA.mes; f <= ultimoDia; f = addDays(f,1)) if(dow(f) === 5) semanas++;
  const PER = { semana:'por semana', dia:'por día', mes:'por mes' };
  const delMes = g => g.monto == null ? null : g.periodo==='mes' ? Number(g.monto) : g.periodo==='dia' ? Number(g.monto) * Number(g.dias_semana || 0) * semanas : Number(g.monto) * semanas;
  const otros = gas.data.filter(g => g.activo);
  const totOtros = otros.reduce((a,g) => a + (delMes(g) || 0), 0);
  const totEmp = filas.reduce((a,x) => a + tot(x), 0);
  el.innerHTML = `<div class="card plata"><div class="row"><h2 class="grow" style="margin:0">Sueldos y extras · ${cap(pLong(HA.mes))}</h2><span class="pill" style="border-color:var(--oro);color:var(--pend-ink)">Solo vos</span></div>
    <div class="row" style="margin-top:10px;gap:6px 14px">
      <span><span class="muted">Hora normal:</span> <b>${pesos(vn)}</b> <button class="btn mini" data-v="valor_hora_normal">Cambiar</button></span>
      <span><span class="muted">Hora extra:</span> <b>${pesos(vh)}</b> <button class="btn mini" data-v="valor_hora_extra">Cambiar</button></span></div>
    <div class="tablewrap" style="margin-top:8px"><table>
      <tr><th>Empleada</th><th class="num">Sueldo normal</th><th class="num">Extras aprobadas</th><th class="num">Total a pagar</th><th class="num">Extras por revisar</th></tr>
      ${filas.map(x => `<tr${x.e.id===HA.emp?' style="background:var(--rosa)"':''}>
        <td><b>${esc(x.e.nombre)}</b><br><button class="linkbtn" data-h="${x.e.id}">${horario[x.e.id] ? esc(resumenHorario(horario[x.e.id])) || 'Sin días' : '+ Cargar horario'}</button></td>
        <td class="num">${x.sueldo != null ? `${pesos(x.sueldo)}<br><small class="muted">${fHs(x.hn)}</small>` : '<span class="muted">—</span>'}</td>
        <td class="num">${x.apr ? `${pesos(x.apr*vh)}<br><small class="muted">${fHs(x.apr)}</small>` : '<span class="muted">—</span>'}</td>
        <td class="num"><b>${pesos(tot(x))}</b></td>
        <td class="num">${x.rev ? `${pesos(x.rev*vh)}<br><small class="muted">${fHs(x.rev)}</small>` : '<span class="muted">—</span>'}</td></tr>`).join('')}
      <tr class="tot"><td>Total</td><td class="num">${pesos(T('sueldo'))}</td><td class="num">${pesos(T('apr')*vh)}</td><td class="num">${pesos(filas.reduce((a,x) => a + tot(x), 0))}</td><td class="num">${T('rev') ? pesos(T('rev')*vh) : '—'}</td></tr>
    </table></div>
    <h3 style="margin:18px 0 0">Otro personal (sin usuario)</h3>
    <div class="tablewrap" style="margin-top:6px"><table>
      <tr><th>Nombre</th><th>Arreglo</th><th class="num">Este mes</th></tr>
      ${otros.map(g => `<tr><td><button class="linkbtn" style="font-size:15px;color:var(--ink);font-weight:600" data-g="${g.id}">${esc(g.nombre)}</button></td>
        <td class="muted">${g.monto != null ? `${pesos(g.monto)} ${PER[g.periodo]}${g.dias_semana ? ` · ${String(Number(g.dias_semana)).replace('.',',')} día${Number(g.dias_semana)===1?'':'s'}/semana` : ''}` : '<span class="st-err">Falta el monto</span>'}${g.nota ? ` · ${esc(g.nota)}` : ''}</td>
        <td class="num">${delMes(g) != null ? `<b>${pesos(delMes(g))}</b>` : '—'}</td></tr>`).join('')}
      <tr class="tot"><td colspan="2">Total otro personal <span class="muted" style="font-weight:400">(${semanas} semanas)</span></td><td class="num">${pesos(totOtros)}</td></tr>
    </table></div>
    <p style="margin:8px 0 0"><button class="btn mini" data-g="">+ Agregar persona</button></p>
    <div class="granTotal"><span>Total de personal del mes</span><b>${pesos(totEmp + totOtros)}</b></div>
    ${T('rev') ? `<p class="muted" style="margin:4px 0 0;font-size:.9rem;text-align:right">+ ${pesos(T('rev')*vh)} si se aprueban las extras por revisar</p>` : ''}
    <p class="muted" style="font-size:.85rem;margin:10px 0 0">Otro personal: las semanas del mes se cuentan por sábados (pago semanal). Aproximado. Sueldo normal = días de su horario en el mes × horas × valor de la hora normal (no descuenta feriados ni faltas). Extras = horas aprobadas × valor de la hora extra. No incluye cargas sociales ni aguinaldo.</p></div>`;
  el.querySelectorAll('[data-v]').forEach(b => b.onclick = async () => {
    const clave = b.dataset.v, actual = c[clave] ?? 0;
    const v = prompt(clave==='valor_hora_normal' ? 'Valor de la hora normal (en pesos):' : 'Valor de la hora extra (en pesos):', String(actual));
    if(v == null) return;
    const n = Number(String(v).replace(/[$.\s]/g,'').replace(',','.'));
    if(!(n >= 0)) return toast('Poné un número válido');
    const { error } = await sb.from('rec_config_privada').upsert({ clave, valor:n, actualizado:new Date().toISOString() });
    if(error) return toast(errMsg(error)); toast('Valor actualizado'); correr(() => cardPlata(activas, ultimoDia));
  });
  el.querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
    const g = gas.data.find(x => x.id === b.dataset.g) || null;
    dlg.innerHTML = `<div class="row"><h2 class="grow" style="margin:0">${g ? esc(g.nombre) : 'Agregar persona'}</h2><button class="btn" id="dx">✕</button></div>
      <form id="fg" class="row" style="flex-direction:column;align-items:stretch;margin-top:12px">
        <label class="f">Nombre<input type="text" name="nombre" maxlength="80" required value="${esc(g?.nombre)}"></label>
        <div class="row"><label class="f grow">Monto ($)<input type="text" name="monto" inputmode="numeric" placeholder="100000" value="${g?.monto != null ? Number(g.monto) : ''}"></label>
          <label class="f grow">Cada<select name="periodo">${Object.entries(PER).map(([k,t]) => `<option value="${k}" ${(g?.periodo||'semana')===k?'selected':''}>${t.replace('por ','')}</option>`).join('')}</select></label></div>
        <label class="f">Días que viene por semana<input type="text" name="dias" inputmode="decimal" placeholder="Ej.: 2" value="${g?.dias_semana != null ? Number(g.dias_semana) : ''}"></label>
        <label class="f">Nota (opcional)<input type="text" name="nota" maxlength="300" value="${esc(g?.nota)}"></label>
        <p class="st-err" id="ge" style="margin:0"></p>
        <div class="row"><button class="btn pri">Guardar</button><button type="button" class="btn" id="gc">Cancelar</button>
          ${g ? '<span class="grow"></span><button type="button" class="btn danger" id="gb">Quitar</button>' : ''}</div>
      </form>`;
    dlg.showModal();
    const ge = dlg.querySelector('#ge');
    dlg.querySelector('#dx').onclick = dlg.querySelector('#gc').onclick = () => dlg.close();
    const gb = dlg.querySelector('#gb');
    if(gb) gb.onclick = async () => {
      if(!confirm(`¿Quitar a ${g.nombre} de los gastos?`)) return;
      const { error } = await sb.from('rec_gastos_privado').update({ activo:false }).eq('id', g.id);
      if(error){ ge.textContent = errMsg(error); return; }
      dlg.close(); toast('Quitada'); correr(() => cardPlata(activas, ultimoDia));
    };
    dlg.querySelector('#fg').onsubmit = async ev => {
      ev.preventDefault(); const f = ev.target;
      const num = v => { v = String(v).trim().replace(/[$.\s]/g,'').replace(',','.'); return v === '' ? null : Number(v); };
      const row = { nombre:f.nombre.value.trim(), monto:num(f.monto.value), periodo:f.periodo.value, dias_semana:num(f.dias.value), nota:f.nota.value.trim() || null };
      if(!row.nombre){ ge.textContent = 'Poné el nombre'; return; }
      if(row.monto != null && !(row.monto >= 0)){ ge.textContent = 'Revisá el monto'; return; }
      if(row.dias_semana != null && !(row.dias_semana >= 0 && row.dias_semana <= 7)){ ge.textContent = 'Los días por semana van de 0 a 7'; return; }
      if(row.periodo === 'dia' && !row.dias_semana){ ge.textContent = 'Si cobra por día, poné cuántos días viene por semana'; return; }
      const { error } = g ? await sb.from('rec_gastos_privado').update(row).eq('id', g.id) : await sb.from('rec_gastos_privado').insert(row);
      if(error){ ge.textContent = errMsg(error); return; }
      dlg.close(); toast('Guardado'); correr(() => cardPlata(activas, ultimoDia));
    };
  });
  el.querySelectorAll('[data-h]').forEach(b => b.onclick = () => {
    const e = empById(b.dataset.h), h = horario[e.id] || {};
    dlg.innerHTML = `<div class="row"><h2 class="grow" style="margin:0">Horario normal de ${esc(e.nombre)}</h2><button class="btn" id="dx">✕</button></div>
      <p class="muted" style="margin:8px 0 12px">Horas que trabaja cada día de la semana. Dejá vacío los días que no va.</p>
      <form id="fh"><div class="hgrid">${DIAS.map((d,i) => `<label class="f">${d}<input type="text" inputmode="decimal" name="d${i}" value="${h[i] ? String(h[i]).replace('.',',') : ''}" placeholder="—"></label>`).join('')}</div>
      <p class="st-err" id="he"></p><div class="row"><button class="btn pri">Guardar</button><button type="button" class="btn" id="hc">Cancelar</button></div></form>`;
    dlg.showModal();
    dlg.querySelector('#dx').onclick = dlg.querySelector('#hc').onclick = () => dlg.close();
    dlg.querySelector('#fh').onsubmit = async ev => {
      ev.preventDefault(); const f = ev.target, nuevo = {};
      for(let i=0; i<7; i++){
        const raw = f['d'+i].value.trim(); if(!raw) continue;
        const n = Number(raw.replace(',','.'));
        if(!(n > 0 && n <= 16)){ dlg.querySelector('#he').textContent = `Revisá las horas del ${DIAS[i]}`; return; }
        nuevo[i] = n;
      }
      const { error } = await sb.from('rec_sueldo_privado').upsert({ empleada_id:e.id, horario:nuevo, actualizado:new Date().toISOString() });
      if(error){ dlg.querySelector('#he').textContent = errMsg(error); return; }
      dlg.close(); toast('Horario guardado'); correr(() => cardPlata(activas, ultimoDia));
    };
  });
}
function correr(fn){ const p = fn(); if(p && p.catch) p.catch(e => { app.innerHTML = `<div class="card"><p class="st-err">Error: ${esc(errMsg(e))}</p></div>`; }); }

// ===== Exportar =====
function vExportar(){
  const n = S.recs.length;
  app.innerHTML = `<div class="card"><h2>Exportar todo</h2>
    <p>Baja un ZIP con una carpeta por empleada, todos los recibos (firmados y originales) y un <i>indice.csv</i> con fechas, conformidad y huellas. Guardalo en el Drive como backup.</p>
    <p><label><input type="checkbox" id="x-pend" checked> Incluir los pendientes (sin firmar)</label></p>
    <button class="btn pri big" id="x-go" ${n?'':'disabled'}>Descargar ZIP (${n} recibos)</button><p id="x-st" class="muted"></p></div>
    <div class="card"><p class="muted" style="margin:0">Sesión: ${esc(S.email)}</p><p><button class="btn" onclick="salir()">Cerrar sesión</button></p></div>`;
  document.getElementById('x-go').onclick = exportar;
}
async function exportar(){
  const btn = document.getElementById('x-go'), st = document.getElementById('x-st'); btn.disabled = true;
  const incPend = document.getElementById('x-pend').checked;
  const zip = new JSZip(); const filas = [['empleada','cuil','periodo','tipo','estado','conformidad','observacion','firmado_en','firmado_ante','sha256_original','sha256_firmado','archivo']];
  const lista = S.recs.filter(r => incPend || r.estado!=='pendiente'); let i = 0;
  try {
    for(const r of lista){
      i++; st.textContent = `Bajando ${i} de ${lista.length}…`;
      const e = empById(r.empleada_id); const dir = winAnsi(e?.nombre||'sin_nombre').replace(/[\\/:*?"<>|]/g,'');
      const pref = `${r.periodo.slice(0,7)}_${r.tipo}`;
      const ext = p => p.split('.').pop();
      let archivo = '';
      if(r.firmado_pdf_path){ archivo = `${dir}/${pref}_firmado.${ext(r.firmado_pdf_path)}`; zip.file(archivo, await bajar(r.firmado_pdf_path)); }
      if(r.pdf_path !== r.firmado_pdf_path){ const a = `${dir}/originales/${pref}_original.${ext(r.pdf_path)}`; zip.file(a, await bajar(r.pdf_path)); if(!archivo) archivo = a; }
      filas.push([e?.nombre, e?.cuil, r.periodo.slice(0,7), r.tipo, r.estado, r.conformidad, r.observacion, r.firmado_en, r.firmado_ante, r.pdf_sha256, r.firmado_pdf_sha256, archivo]);
    }
    const csv = '\ufeff' + filas.map(f => f.map(v => `"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\r\n');
    zip.file('indice.csv', csv);
    st.textContent = 'Armando ZIP…';
    const blob = await zip.generateAsync({ type:'blob' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `recibos_lilen_${new Date().toISOString().slice(0,10)}.zip`; a.click();
    st.textContent = 'Listo ✓';
  } catch(e){ st.textContent = 'Error: ' + errMsg(e); }
  btn.disabled = false;
}

init().catch(e => { app.innerHTML = `<div class="card"><p class="st-err">Error: ${esc(errMsg(e))}</p></div>`; });
</script>
